<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuseHub — Artists</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <h4>MuseHub</h4>
  <nav class="nav-column">
    <a href="index.html">Dashboard</a>
    <a href="artists.html">Artists</a>
    <a href="minigame.html">Mini-game</a>

  </nav>

<aside class="rightbar">
  <h5>Top Artist</h5>
  <div class="list-group">
    <div class="list-group-item">The Weeknd</div>
    <div class="list-group-item">Taylor Swift</div>
  </div>
</aside>

<main class="main">
  <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem">
    <h2>All Artists</h2>
    <div style="margin-left:auto; display:flex; gap:.5rem; align-items:center;">
      <input id="search" placeholder="Search artists..." style="padding:.5rem 1rem; border-radius:999px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03)"/>
      <select id="genre"><option value="">All genres</option><option>Pop</option><option>R&B</option><option>Rock</option></select>
      <select id="sort"><option value="name">Sort by name</option></select>
    </div>
  </div>

  <ul id="artist-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" style="list-style:none; padding:0; margin:0"></ul>
</main>

<script src="js/main.js"></script>
<script src="js/artists.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
