<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <h4>MuseHub</h4>
  <nav class="nav-column">
    <a href="index.html">Dashboard</a>
    <a href="artists.html">Artists</a>
    <a href="minigame.html">Mini-game</a>
    <a href="aboutANDcontact.html">About / Contact</a>

<aside class="rightbar">
  <h5>Top Artist</h5>
  <div class="list-group">
    <div class="list-group-item">The Weeknd</div>
    <div class="list-group-item">Taylor Swift</div>
  </div>
</aside>

<main class="main">
  <h2>About MuseHub</h2>
  <p>MuseHub is a student project to browse artists, play tracks and enjoy mini-games.</p>

  <h3 style="margin-top:1.25rem">Contact</h3>
  <form id="contact-form" style="max-width:640px;">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input id="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input id="email" class="form-control" type="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea id="message" class="form-control" rows="4" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Send Message</button>
  </form>
</main>


<script src="js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
