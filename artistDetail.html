<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuseHub — Artist Detail</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside class="sidebar">
  <h4>MuseHub</h4>
  <nav class="nav-column">
    <a href="index.html">Dashboard</a>
    <a href="artists.html">Artists</a>
    <a href="minigame.html">Mini-game</a>
    <a href="aboutANDcontact.html">About / Contact</a>
  </nav>
</aside>

<aside class="rightbar">
  <h5>Top Artist</h5>
  <div class="list-group">
    <div class="list-group-item">The Weeknd</div>
    <div class="list-group-item">Taylor Swift</div>
  </div>
</aside>

<main class="main">
  <h2 id="artist-name">Artist Name</h2>
  <img id="artist-photo" src="assets/images/placeholder.jpg" alt="artist" style="width:320px;border-radius:12px;margin-bottom:1rem"/>
  <p><strong>Genre:</strong> <span id="artist-genre"></span></p>
  <p><strong>Country:</strong> <span id="artist-country"></span></p>

  <section>
    <h3>Biography</h3>
    <p id="artist-bio">Short bio will appear here.</p>
  </section>

  <section>
    <h3>Top tracks</h3>
    <ol id="artist-tracks"></ol>
  </section>

  <div style="margin-top:1rem">
    <button id="favorite-button" class="btn btn-primary">Add to favorites</button>
    <a href="artists.html" style="margin-left:1rem;color:var(--muted)">← Back</a>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/artistDetail.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
